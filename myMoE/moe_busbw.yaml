# MoE推理专用通信带宽配置 - H800x4，400Gbps网络，Attention DP4 + FFN EP4
# 基于无NVLink环境下的PCIe 5.0和400Gbps以太网实测数据

# 验证器期望的标准带宽配置
DP_AllReduce: 35.0     # GB/s - Attention层4路数据并行
EP_AlltoAll: 35.0      # GB/s - FFN层4路专家并行

# 层特定并行配置
Attention_DP4_AllReduce: 35.0    # GB/s - Attention层4路DP AllReduce
FFN_EP4_AlltoAll: 35.0           # GB/s - FFN层4路EP AlltoAll

moe_inference_h800_cluster:

# Attention层数据并行 (4路DP，跨GPU注意力计算同步)  
Attention_DP:
  allreduce: 35       # 4路DP AllReduce，受限于PCIe 5.0
  allgather: 40       # 注意力权重收集
  reducescatter: 40   # 注意力输出分散
  alltoall: 30        # 注意力模式重排
  overlap_efficiency: 0.75  # Attention层重叠效率较高

# FFN专家并行 (4路EP，跨GPU专家计算)
FFN_EP:
  allreduce: 38       # FFN层少量同步需求
  allgather: 42       # 专家参数收集  
  reducescatter: 42   # 专家结果分散
  alltoall: 35        # 专家路由，FFN最关键通信模式
  overlap_efficiency: 0.85  # EP层重叠效率最高

# DP+EP组合并行模式（主要使用模式）
DP_EP:
  allreduce: 25       # DP+EP组合的AllReduce，双重网络开销
  allgather: 30       # DP+EP组合的AllGather
  reducescatter: 30   # DP+EP组合的ReduceScatter
  alltoall: 22        # DP+EP组合的AllToAll，最大瓶颈
  overlap_efficiency: 0.75  # 组合模式重叠效率

# MoE推理特有的通信模式优化
moe_inference_optimization:
  expert_discovery_bw: 40     # 专家发现阶段带宽
  token_routing_bw: 32        # Token路由带宽（推理关键）
  expert_output_gather_bw: 38 # 专家输出聚合带宽
  load_balancing_bw: 28       # 负载均衡通信带宽

# H800硬件特性对重叠的影响
h800_hardware_factors:
  pcie5_bandwidth_limit: 0.8     # PCIe 5.0带宽利用率限制
  no_nvlink_penalty: 0.6         # 无NVLink的性能损失
  network_400gbps_efficiency: 0.75  # 400Gbps网络实际效率
  
# 网络拓扑对重叠的影响（单节点4GPU）
topology_overlap_factor:
  intra_node_pcie: 0.70          # 节点内PCIe通信重叠效率
  inter_gpu_network: 0.60        # GPU间网络通信重叠效率

# 推理特有的重叠优化参数
inference_overlap_parameters:
  # 推理阶段通信计算比例
  forward_only_ratio: 1.0        # 仅前向推理
  no_gradient_sync: true         # 无梯度同步
  
  # 消息大小对重叠的影响（推理优化）  
  message_size_overlap:
    small_tokens: 0.4    # < 512 tokens，延迟主导
    medium_tokens: 0.75  # 512-2048 tokens，最佳重叠区间  
    large_tokens: 0.65   # > 2048 tokens，带宽主导
    
  # 专家激活模式对重叠的影响
  expert_activation_overlap:
    qwen3_235b_8experts: 0.85    # 激活8个专家的重叠效率
    qwen3_30b_8experts: 0.80     # 30B模型相对较低
    phi_mini_2experts: 0.75      # 仅激活2个专家

# MoE推理调度策略对应的带宽调整
inference_scheduling_strategy_bw:
  aggressive_overlap:
    multiplier: 1.10             # 激进重叠策略提升10%
    latency_penalty: 0.08        # 推理延迟敏感，开销较大
    
  conservative_overlap:
    multiplier: 1.05             # 保守重叠策略提升5%  
    latency_penalty: 0.03        # 延迟开销较小
    
  no_overlap:
    multiplier: 1.0              # 无重叠基准性能
    latency_penalty: 0.0

# 推理批处理对通信性能的影响
inference_batch_factors:
  batch_size_1: 0.6              # 单样本推理，通信开销大
  batch_size_8: 0.85             # 小批量，较优
  batch_size_32: 1.0             # 中等批量，最优
  batch_size_128: 0.9            # 大批量，内存压力

# 动态调整参数（推理优化）
dynamic_inference_optimization:
  adaptive_overlap: true         # 启用自适应重叠
  token_length_aware: true       # 基于token长度调整
  expert_load_balancing: true    # 专家负载均衡
  overlap_threshold: "2MB"       # 推理重叠阈值（较小）
  max_concurrent_comms: 2        # 推理时并发通信数量（较少）
